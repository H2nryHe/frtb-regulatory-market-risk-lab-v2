risk_factors:
  - risk_factor_id: RF_GIRR_USD_5Y
    risk_class: GIRR
    risk_factor_type: risk_free_yield_curve_tenor
    bucket_or_category: USD
    tenor_or_vertex: 5Y
    currency: USD
    underlier_or_issuer: USD_OIS_CURVE
    source_instrument_ids: [SYN_USD_GOVT_5Y, SYN_USD_IRS_5Y]
    required_sensitivity_types: [delta]
    future_rfet_scope: IN_SCOPE_LATER
    status: ACTIVE_SYNTHETIC
    source_id: BIS_MAR21
    source_paragraph_or_table: MAR21.8
    notes: Taxonomy record only; no sensitivity value is calculated in Phase 1.
  - risk_factor_id: RF_EQUITY_SPX_SPOT
    risk_class: EQUITY
    risk_factor_type: equity_spot
    bucket_or_category: selected_index
    tenor_or_vertex: spot
    currency: USD
    underlier_or_issuer: SYN_SPX_INDEX
    source_instrument_ids: [SYN_EQ_INDEX, SYN_EQ_CALL, SYN_EQ_BARRIER]
    required_sensitivity_types: [delta, curvature]
    future_rfet_scope: IN_SCOPE_LATER
    status: ACTIVE_SYNTHETIC
    source_id: BIS_MAR21
    source_paragraph_or_table: MAR21.12; MAR21.72
    notes: Selected equity spot risk-factor taxonomy for later phases.
  - risk_factor_id: RF_EQUITY_SPX_VOL_1Y
    risk_class: EQUITY
    risk_factor_type: equity_implied_volatility
    bucket_or_category: selected_index
    tenor_or_vertex: 1Y
    currency: USD
    underlier_or_issuer: SYN_SPX_INDEX
    source_instrument_ids: [SYN_EQ_CALL, SYN_EQ_BARRIER]
    required_sensitivity_types: [vega]
    future_rfet_scope: IN_SCOPE_LATER
    status: ACTIVE_SYNTHETIC
    source_id: BIS_MAR21
    source_paragraph_or_table: MAR21.25-MAR21.28
    notes: Required only for optional equity instruments in later phases.
  - risk_factor_id: RF_FX_EURUSD_SPOT
    risk_class: FX
    risk_factor_type: fx_spot
    bucket_or_category: EUR
    tenor_or_vertex: spot
    currency: USD
    underlier_or_issuer: EURUSD
    source_instrument_ids: [SYN_EURUSD_FWD, SYN_EURUSD_CALL]
    required_sensitivity_types: [delta, curvature]
    future_rfet_scope: IN_SCOPE_LATER
    status: ACTIVE_SYNTHETIC
    source_id: BIS_MAR21
    source_paragraph_or_table: MAR21.14; MAR21.24
    notes: Selected FX spot risk-factor taxonomy for later phases.
  - risk_factor_id: RF_FX_EURUSD_VOL_1Y
    risk_class: FX
