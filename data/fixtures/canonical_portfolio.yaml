    bucket_or_category: EUR
    tenor_or_vertex: 1Y
    currency: USD
    underlier_or_issuer: EURUSD
    source_instrument_ids: [SYN_EURUSD_CALL]
    required_sensitivity_types: [vega]
    future_rfet_scope: IN_SCOPE_LATER
    status: ACTIVE_SYNTHETIC
    source_id: BIS_MAR21
    source_paragraph_or_table: MAR21.25-MAR21.28
    notes: Required only for optional FX instruments in later phases.
  - risk_factor_id: RF_CSR_SYN_CORP_A_DEFAULT
    risk_class: CSR_NON_SECURITISATION
