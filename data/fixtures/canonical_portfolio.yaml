metadata:
  fixture_id: canonical_phase1_synthetic_portfolio
  description: Synthetic educational portfolio for selected Basel market-risk mechanics.
  synthetic: true
  source_basis:
    - BIS_MAR20
    - BIS_MAR21
    - BIS_MAR22
    - BIS_MAR23

desks:
  - desk_id: TD-RATES
    desk_name: Synthetic Rates Desk
    description: Synthetic USD rates positions used for future selected GIRR mechanics.
    portfolio_scope: synthetic educational portfolio
    trading_book_scope: selected trading-book example
    planned_sa_scope: GIRR SBM
    planned_ima_scope: selected ES/RFET/PLA/backtesting diagnostics
    status: ACTIVE_SYNTHETIC
    notes: Not an actual institutional trading desk.
  - desk_id: TD-EQUITY
    desk_name: Synthetic Equity Desk
    description: Synthetic equity index and option positions for future selected equity mechanics.
    portfolio_scope: synthetic educational portfolio
    trading_book_scope: selected trading-book example
    planned_sa_scope: Equity SBM and RRAO preparation
    planned_ima_scope: selected ES/RFET/PLA/backtesting diagnostics
    status: ACTIVE_SYNTHETIC
    notes: Includes a barrier option only as an RRAO preparation example.
  - desk_id: TD-FX
    desk_name: Synthetic FX Desk
    description: Synthetic EUR/USD forward and option positions for future selected FX mechanics.
    portfolio_scope: synthetic educational portfolio
    trading_book_scope: selected trading-book example
    planned_sa_scope: FX SBM
    planned_ima_scope: selected ES/RFET/PLA/backtesting diagnostics
    status: ACTIVE_SYNTHETIC
    notes: Uses deterministic notional metadata only; no live market data.
  - desk_id: TD-CREDIT
    desk_name: Synthetic Credit Desk
    description: Synthetic CSR non-securitisation corporate credit position for DRC preparation.
    portfolio_scope: synthetic educational portfolio
    trading_book_scope: selected trading-book example
    planned_sa_scope: CSR non-securitisation taxonomy and DRC preparation
    planned_ima_scope: not in Phase 1 scope
    status: ACTIVE_SYNTHETIC
    notes: No DRC capital is calculated in Phase 1.

